	<!-- Стрічка -->

	<!-- ===== QR ===== -->
	<div class="modal" id="modal">
		<div class="qr">
			<img src="qr.png" alt="QR-код">
		</div>
		<button class="close" id="closeModal"></button>
	</div>


	<script>
		/* ================= ДАНІ ================= */
		var DEFAULT_PIN = "1234";
		var DATA = {
			name: "ВІЛІВЧУК\nРоман\nВасильович",
			birthLabel: "Дата народження",
			birth: "27.07.1990",
			workLabel: "Відстрочка до:",
			work: "23.07.2027",
			ticker: "Документ оновлено о 21:43 ┃ 11.11.2026 ●Документ оновлено о 21:43 ┃ 11.11.2026 ● "
		};
		var QR_TEXT = "https://t.me/username";

		/* ================= УТИЛІТИ ================= */
		function $(s) { return document.querySelector(s); }
		function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; } return String(h); }

		/* ================= ЗАСТАВКА ================= */
		(function () {
			var sp = $("#splash"), tip = $("#splashTip");
			if (!sp) return;
			var t = 3, timer = setInterval(function () {
				t--; tip.textContent = "завантаження… " + t + " с";
				if (t <= 0) { clearInterval(timer); finish(); }
			}, 1000);
			function finish() {
				sp.classList.add("hide");
				setTimeout(function () { sp.style.display = "none"; }, 500);
			}
			sp.addEventListener("click", function () { clearInterval(timer); finish(); });
		})();

		/* ================= PIN ================= */
		(function () {
			var KEY = "app_pin_v3";
			if (!localStorage.getItem(KEY)) localStorage.setItem(KEY, hash(DEFAULT_PIN));

			var entered = "";
			var dots = $("#dots").children;
			var err = $("#err");
			var lock = $("#lock"), resume = $("#resume");

			function render() {
				for (var i = 0; i < dots.length; i++) dots[i].className = "dot" + (i < entered.length ? " on" : "");
			}
			function shake() {
				err.textContent = "Неправильний пароль";
				$("#dots").style.transform = "translateX(-6px)";
				setTimeout(function () { $("#dots").style.transform = "translateX(6px)"; }, 110);
				setTimeout(function () { $("#dots").style.transform = "translateX(0)"; }, 220);
				setTimeout(function () { err.textContent = ""; }, 1200);
			}
			function submit() {
				if (entered.length < 4) return;
				if (hash(entered) === localStorage.getItem(KEY)) {
					lock.classList.add("hidden");
					resume.classList.add("show");
					window.scrollTo(0, 0);
				} else { shake(); entered = ""; render(); }
			}
			$("#pins").addEventListener("click", function (e) {
				var k = e.target.getAttribute("data-k");
				if (!k) return;
				if (k === "del") { entered = entered.slice(0, -1); render(); return; }
				if (entered.length >= 4) return;
				entered += k; render();
				if (entered.length === 4) setTimeout(submit, 120);
			});
			document.addEventListener("keydown", function (e) {
				if (/^[0-9]$/.test(e.key) && entered.length < 4) { entered += e.key; render(); if (entered.length === 4) setTimeout(submit, 120); }
				if (e.key === "Backspace") { entered = entered.slice(0, -1); render(); }
			});
		})();

		/* ================= ЗАПОВНЕННЯ ================= */
		(function () {
			$("#rName").textContent = DATA.name;
			$("#rBirthLabel").textContent = DATA.birthLabel;
			$("#rBirth").textContent = DATA.birth;
			$("#rWorkLabel").textContent = DATA.workLabel;
			$("#rWork").textContent = DATA.work;
			$("#rTicker").textContent = DATA.ticker;
		})();


		/* ================= ПЛЮС ================= */
		document.getElementById("plus").addEventListener("click", function () {
			this.classList.toggle("active");
		});
		/* ================= QR ================= */
		(function () {
			var modal = $("#modal");
			var photo = $("#photo");

			photo.addEventListener("click", function () {
				modal.classList.add("show");
			});
			$("#closeModal").addEventListener("click", function () {
				modal.classList.remove("show");
			});
			modal.addEventListener("click", function (e) {
				if (e.target === modal) modal.classList.remove("show");
			});
		})();

	</script>
